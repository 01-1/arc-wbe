[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whest-starterkit"
version = "0.1.0"
description = "Starter kit for the ARC Whitebox Estimation Challenge"
requires-python = ">=3.10"
dependencies = [
    "flopscope>=0.5.0",
    "whestbench>=0.10.0",
]

[dependency-groups]
dev = [
    "gprof2dot>=2025.4.14",
    "pyinstrument>=5.1.2",
    "pytest>=8.2.0",
    "ruff>=0.6.0",
    "snakeviz>=2.2.2",
    "yappi>=1.7.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools]
py-modules = []
