[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flopscope"
version = "0.8.0rc2+gpu.np2.2.6"
description = "Local flopscope fork with optional GPU-backed execution"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0,<2.5.0",
    "opt-einsum>=3.4.0",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0.0",
]

[tool.setuptools.packages.find]
include = ["flopscope*"]

[tool.setuptools.package-data]
flopscope = ["py.typed", "data/*.json", "data/*.csv", "data/*.md", "_opt_einsum/LICENSE", "_opt_einsum/NOTICE"]
